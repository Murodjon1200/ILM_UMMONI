services:
  - type: web
    name: ilm-ummoni
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXT_PUBLIC_CENTER_PHONE
        sync: false
      - key: NEXT_PUBLIC_CENTER_ADDRESS
        sync: false
